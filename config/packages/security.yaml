security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        user_web:
            id: App\Infrastructure\Security\Provider\UserWebProvider
        api_area_usuario:
            chain:
                providers:
                    - user_web
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # POST /api/login. Stateless on purpose: the point of this endpoint is
        # to hand out a JWT, so it must not also open a session that would
        # authenticate later requests on its own.
        api_auth:
            pattern: ^%api_route_prefix%/login$
            stateless: true
            provider: api_area_usuario
            host: '%api_domain%'
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: Api\Infrastructure\Security\Authenticator\CustomAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Everything else under the API prefix. The pattern used to be
        # ^/area-usuario/, which no route has ever matched: routes are mounted
        # under %api_route_prefix% (/api), so the JWT authenticator was simply
        # never reached and every API request fell through to the login
        # firewall, which had no pattern of its own.
        api:
            pattern: ^%api_route_prefix%
            stateless: true
            provider: api_area_usuario
            host: '%api_domain%'
            jwt: ~

    # Paths are matched against the real routes. The previous entry pointed at
    # ^/api/area-usuario/, which matched nothing, so ROLE_WEB was never
    # required anywhere - including on the endpoint the README documents as
    # "hay que estar autenticado".
    access_control:
        # API Platform's docs, entrypoint and JSON-LD contexts.
        - { path: '^%api_route_prefix%(/(docs|contexts|index)?)?$', roles: PUBLIC_ACCESS, host: '%api_domain%' }
        - { path: '^%api_route_prefix%/login$', roles: PUBLIC_ACCESS, host: '%api_domain%' }
        # Sign-up: creating the account cannot itself require an account.
        - { path: '^%api_route_prefix%/users/', roles: PUBLIC_ACCESS, host: '%api_domain%' }
        # Public catalogue listing.
        - { path: '^%api_route_prefix%/productos/', roles: PUBLIC_ACCESS, host: '%api_domain%' }
        # Product creation - the one endpoint that needs a web user.
        - { path: '^%api_route_prefix%/form/', roles: ROLE_WEB, host: '%api_domain%' }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
